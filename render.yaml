# ============================================================
# render.yaml — a API no Render
# ============================================================
# O Render lê este arquivo ("Blueprint") e cria o serviço sozinho. A cada
# push no GitHub ele instala, compila, aplica as migrations pendentes
# (`prisma migrate deploy`, dentro do start) e sobe a versão nova.
#
# O banco NÃO está aqui de propósito: ele fica no Neon (grátis, sem prazo).
# A string de conexão entra como variável no painel do Render — nunca no
# repositório.
# ============================================================

services:
  - type: web
    name: gestor-financeiro-api
    runtime: node
    region: oregon
    # PENDENTE: trocar para `starter` depois de confirmar a cobranca no painel
    # do Render. A instancia free hiberna apos 15 min (ate 50s de espera no
    # primeiro acesso) e tem 0,1 CPU; a starter (0.5c-512mb, US$ 7/mes) tem 0,5
    # CPU, a MESMA RAM de 512 MB que ja basta hoje, e nao hiberna.
    #
    # Trocar so no painel nao resolve: este servico e blueprint managed, e
    # enquanto esta linha disser "free" uma sincronizacao futura devolve a
    # instancia para gratuita — e a hibernacao volta sem ninguem entender por que.
    #
    # O plano do WORKSPACE (US$ 25/mes) nao tem relacao: ele define recursos da
    # plataforma, nao o tipo de instancia dos servicos.
    plan: free
    rootDir: gestor-financeiro-api
    # `--include=dev` não é enfeite: o Render roda com NODE_ENV=production, e
    # nesse modo o npm pula as devDependencies — sem elas não existe `nest`
    # para compilar nem `prisma` para migrar no start.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # Segredo do JWT: o Render gera um valor forte e guarda no painel.
      # Ninguém precisa digitar, ver ou colar esse valor em lugar nenhum.
      - key: JWT_SECRET
        generateValue: true
      # Preencher no painel do Render (Environment):
      # DATABASE_URL  → connection string do Neon, a POOLED (tem "-pooler" no host)
      # DIRECT_URL    → a mesma do Neon, mas a DIRETA (sem "-pooler"): as
      #                 migrations não passam por pool (ver prisma/schema.prisma)
      # CORS_ORIGINS  → a URL do app no Cloudflare Pages, ex.: https://gestor-financeiro.pages.dev
      # APP_URL       → a mesma URL do app. Usada nos links de e-mail E como
      #                 endereço de retorno do checkout do Asaas: é de onde
      #                 sai o "para onde devolver quem pagou", que nunca vem
      #                 do cliente. Precisa ser https e público — o Asaas
      #                 recusa endereço local.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      # App (pages.dev) e API (onrender.com) são domínios diferentes, e com
      # SameSite=Strict o navegador não manda o cookie de sessão. Ver
      # src/auth/session-cookie.ts. Com domínio próprio nos dois, volte a strict.
      - key: COOKIE_SAMESITE
        value: none
      # Serviço de e-mail. Em NONE a API sobe normalmente e só a recuperação
      # de senha fica desligada, avisando quem tentar.
      #
      # ORDEM IMPORTA ao ligar o Resend: o ResendMailer confere as duas
      # variáveis abaixo NO CONSTRUTOR, que roda na subida. Trocar para RESEND
      # antes de a chave existir no painel derruba o deploy inteiro, não só o
      # e-mail. Primeiro preencha RESEND_API_KEY no Render; depois troque aqui.
      - key: MAIL_PROVIDER
        value: RESEND
      # Preencher no painel do Render (Environment). NUNCA no repositório:
      # ele é público. A chave começa com "re_".
      - key: RESEND_API_KEY
        sync: false
      # ---- Cobrança de assinatura (Asaas) ----
      #
      # FAKE sobe a API sem gateway nenhum: a tela de assinatura some
      # sozinha no app, porque a resposta de /billing/subscription diz que
      # não há com que cobrar. Trocar para ASAAS LIGA a cobrança.
      #
      # ORDEM IMPORTA, como no Resend: preencha as três variáveis abaixo no
      # painel ANTES de trocar este valor. Com ASAAS e sem chave, o primeiro
      # pedido de checkout falha — e quem tentar assinar vê erro.
      - key: PAYMENT_PROVIDER
        value: FAKE
      # Preencher no painel do Render. NUNCA no repositório: ele é público.
      #
      # ASAAS_API_KEY       a chave de PRODUÇÃO da conta Asaas. A de sandbox
      #                     começa com "$aact_hmlg_" e o adaptador recusa
      #                     rodar se ela não combinar com a URL abaixo.
      # ASAAS_WEBHOOK_TOKEN valor que VOCÊ inventa (32 a 255 caracteres) e
      #                     repete ao criar o webhook no painel do Asaas. Não
      #                     é a chave de API. Sem ele, a rota de webhook
      #                     recusa tudo — que é o certo.
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      # Produção. O sandbox é https://api-sandbox.asaas.com/v3 — e apontar
      # para lá com chave de produção (ou o contrário) é recusado antes de a
      # chamada sair, para um teste não cobrar gente de verdade.
      - key: ASAAS_BASE_URL
        value: https://api.asaas.com/v3
      # Este não é segredo e fica versionado. O domínio precisa estar
      # verificado no Resend, e o endereço não precisa de caixa postal: o
      # Resend só envia, e quem responder cai em contato@saldonline.com.br
      # se houver Reply-To — por ora, ninguém responde a um "não responda".
      - key: MAIL_FROM
        value: "saldonline <nao-responda@saldonline.com.br>"
