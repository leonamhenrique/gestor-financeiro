# ============================================================
# render.yaml — a API no Render
# ============================================================
# O Render lê este arquivo ("Blueprint") e cria o serviço sozinho. A cada
# push no GitHub ele instala, compila, aplica as migrations pendentes
# (`prisma migrate deploy`, dentro do start) e sobe a versão nova.
#
# O banco NÃO está aqui de propósito: ele fica no Neon (grátis, sem prazo).
# A string de conexão entra como variável no painel do Render — nunca no
# repositório.
# ============================================================

services:
  - type: web
    name: gestor-financeiro-api
    runtime: node
    region: oregon
    # PENDENTE: trocar para `starter` depois de confirmar a cobranca no painel
    # do Render. A instancia free hiberna apos 15 min (ate 50s de espera no
    # primeiro acesso) e tem 0,1 CPU; a starter (0.5c-512mb, US$ 7/mes) tem 0,5
    # CPU, a MESMA RAM de 512 MB que ja basta hoje, e nao hiberna.
    #
    # Trocar so no painel nao resolve: este servico e blueprint managed, e
    # enquanto esta linha disser "free" uma sincronizacao futura devolve a
    # instancia para gratuita — e a hibernacao volta sem ninguem entender por que.
    #
    # O plano do WORKSPACE (US$ 25/mes) nao tem relacao: ele define recursos da
    # plataforma, nao o tipo de instancia dos servicos.
    plan: free
    rootDir: gestor-financeiro-api
    # `--include=dev` não é enfeite: o Render roda com NODE_ENV=production, e
    # nesse modo o npm pula as devDependencies — sem elas não existe `nest`
    # para compilar nem `prisma` para migrar no start.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # Segredo do JWT: o Render gera um valor forte e guarda no painel.
      # Ninguém precisa digitar, ver ou colar esse valor em lugar nenhum.
      - key: JWT_SECRET
        generateValue: true
      # Segredo que entra no hash do telefone do WhatsApp (HMAC). Gerado pelo
      # Render, como o de cima, e pelo mesmo motivo: ninguem precisa ver.
      #
      # Telefone tem pouca entropia, e um SHA-256 puro dele se reverte por
      # forca bruta; com este segredo, quem levar so o banco nao descobre
      # numero nenhum. Trocar ou perder o valor nao quebra o app: invalida os
      # vinculos, e quem usava o WhatsApp pareia de novo pela tela.
      - key: WHATSAPP_PHONE_PEPPER
        generateValue: true
      # O que a Meta devolve no aperto de mao do webhook. Quem escolhe o
      # valor e voce: o Render gera, e o mesmo valor vai digitado no painel
      # da Meta ao cadastrar o webhook.
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      # Preencher no painel do Render, copiando do painel da Meta:
      # WHATSAPP_APP_SECRET → App Secret do app da Meta. E com ele que a API
      #                 confere a assinatura do corpo de cada mensagem. SEM
      #                 ELE NENHUMA MENSAGEM E ACEITA (falha fechada).
      # WHATSAPP_TOKEN → token permanente do System User, com as permissoes
      #                 whatsapp_business_messaging e _management. E o que
      #                 permite RESPONDER.
      # WHATSAPP_PHONE_ID → id do numero remetente (Phone Number ID).
      #
      #
      # TRANSCRICAO DE AUDIO (recado de voz no WhatsApp). Preencher no
      # painel so quando for usar -- enquanto estiverem vazias, a API diz
      # que nao escuta audio e NENHUM BYTE sai daqui. O padrao e mudo de
      # proposito: o audio vai para um terceiro, e isso tem de ser uma
      # escolha, nao um efeito colateral de um deploy.
      # STT_PROVIDER  → hoje so "openai" (Whisper). Trocar de servico e
      #                 trocar um metodo em audio.service.ts.
      # STT_API_KEY   → a chave do servico escolhido.
      # STT_MODEL     → opcional; o padrao e whisper-1.
      # Sem WHATSAPP_TOKEN e WHATSAPP_PHONE_ID a API le a mensagem e nao
      # responde: e o estado de desenvolvimento, mudo de proposito.
      # Preencher no painel do Render (Environment):
      # DATABASE_URL  → connection string do Neon, a POOLED (tem "-pooler" no host)
      # DIRECT_URL    → a mesma do Neon, mas a DIRETA (sem "-pooler"): as
      #                 migrations não passam por pool (ver prisma/schema.prisma)
      # CORS_ORIGINS  → a URL do app no Cloudflare Pages, ex.: https://gestor-financeiro.pages.dev
      # APP_URL       → a mesma URL do app. Usada nos links de e-mail E como
      #                 endereço de retorno do checkout do Asaas: é de onde
      #                 sai o "para onde devolver quem pagou", que nunca vem
      #                 do cliente. Precisa ser https e público — o Asaas
      #                 recusa endereço local.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      # App em saldonline.com.br e API em api.saldonline.com.br: MESMO domínio
      # registrável, logo o mesmo site para o navegador. O cookie de sessão é
      # de primeira parte e `strict` funciona — que é o que queremos, porque
      # `none` significa "cookie de terceiro", e isso o Safari bloqueia por
      # padrão e o Chrome vem restringindo. Com `none`, recarregar a página
      # voltava para o login. Ver src/auth/session-cookie.ts.
      #
      # Se um dia a API sair deste domínio, isto precisa voltar para `none` —
      # e aí a sessão volta a depender de política de cookie de terceiro.
      - key: COOKIE_SAMESITE
        value: strict
      # Serviço de e-mail. Em NONE a API sobe normalmente e só a recuperação
      # de senha fica desligada, avisando quem tentar.
      #
      # ORDEM IMPORTA ao ligar o Resend: o ResendMailer confere as duas
      # variáveis abaixo NO CONSTRUTOR, que roda na subida. Trocar para RESEND
      # antes de a chave existir no painel derruba o deploy inteiro, não só o
      # e-mail. Primeiro preencha RESEND_API_KEY no Render; depois troque aqui.
      - key: MAIL_PROVIDER
        value: RESEND
      # Preencher no painel do Render (Environment). NUNCA no repositório:
      # ele é público. A chave começa com "re_".
      - key: RESEND_API_KEY
        sync: false
      # ---- Cobrança de assinatura (Asaas) ----
      #
      # FAKE sobe a API sem gateway nenhum: a tela de assinatura some
      # sozinha no app, porque a resposta de /billing/subscription diz que
      # não há com que cobrar. Trocar para ASAAS LIGA a cobrança.
      #
      # ORDEM IMPORTA, como no Resend: preencha as três variáveis abaixo no
      # painel ANTES de trocar este valor. Com ASAAS e sem chave, o primeiro
      # pedido de checkout falha — e quem tentar assinar vê erro.
      - key: PAYMENT_PROVIDER
        value: FAKE
      # Preencher no painel do Render. NUNCA no repositório: ele é público.
      #
      # ASAAS_API_KEY       a chave de PRODUÇÃO da conta Asaas. A de sandbox
      #                     começa com "$aact_hmlg_" e o adaptador recusa
      #                     rodar se ela não combinar com a URL abaixo.
      # ASAAS_WEBHOOK_TOKEN valor que VOCÊ inventa (32 a 255 caracteres) e
      #                     repete ao criar o webhook no painel do Asaas. Não
      #                     é a chave de API. Sem ele, a rota de webhook
      #                     recusa tudo — que é o certo.
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      # Produção. O sandbox é https://api-sandbox.asaas.com/v3 — e apontar
      # para lá com chave de produção (ou o contrário) é recusado antes de a
      # chamada sair, para um teste não cobrar gente de verdade.
      - key: ASAAS_BASE_URL
        value: https://api.asaas.com/v3
      # ---------- Open Finance (Polp / Celcoin) ----------
      # EXPERIMENTO. Enquanto estas três não existirem no painel, o módulo
      # inteiro responde 404 e o app se comporta exatamente como antes dele.
      #
      # As chaves ficam no painel, nunca aqui: `x-api-secret` dá acesso a
      # TODOS os consentimentos da conta — os de todo mundo, não só os de
      # quem está logado. O `sync: false` é o que documenta o NOME sem
      # trazer o valor, e também o que impede uma reaplicação do blueprint
      # de varrer do painel uma variável que ele não conhecia.
      - key: POLP_API_CLIENT
        sync: false
      - key: POLP_API_SECRET
        sync: false
      # "true" liga as rotas. Qualquer outra coisa, inclusive ausente, 404.
      - key: OPENFINANCE_ENABLED
        sync: false
      # Quem ENXERGA a integração: ids ou e-mails separados por vírgula.
      #
      # Existe porque ligar a flag sozinha estrearia o recurso para o app
      # inteiro — e cada consentimento autorizado é cobrado na nossa conta do
      # provedor, de quem quer que conecte. Com a lista, a integração sobe
      # ligada e segue invisível para todos menos para quem está nela.
      # VAZIA quer dizer TODO MUNDO.
      - key: OPENFINANCE_USERS
        sync: false
      # O segredo que o provedor apresenta ao nos avisar que chegou dado
      # novo. O MESMO valor vai no cabeçalho customizado do painel da Polp.
      #
      # Sem ele a rota do webhook recusa TUDO, inclusive quem manda token —
      # porque "sem segredo, aceita todo mundo" é a falha que se instala
      # sozinha: basta esquecer a variável num ambiente novo e a porta fica
      # aberta, em silêncio, funcionando.
      - key: POLP_WEBHOOK_TOKEN
        sync: false
      # O segredo que a POLP gera ao ligar a assinatura HMAC-SHA256 (tela de
      # webhooks, exibido uma vez só). Com ele a rota confere a assinatura —
      # mas antes precisa descobrir COMO ela é feita, porque a documentação
      # pública não diz o que é assinado nem em que codificação.
      - key: POLP_WEBHOOK_SIGNING_SECRET
        sync: false
      # O nome do esquema de assinatura, depois de descoberto. VAZIO = fase
      # de descoberta: a rota calcula as variantes conhecidas e registra no
      # log o nome da que bate, sem recusar nada por causa disso. Preenchido
      # (ex.: `corpo-hex`), a assinatura passa a ser EXIGIDA.
      #
      # Recusar antes de entender perderia entregas boas em silêncio, que é
      # o pior desfecho para um aviso que não se repete para sempre.
      - key: OPENFINANCE_SIGNATURE
        sync: false
      # ---- Aviso no celular (push) ----
      # O par VAPID que assina os avisos. Gere UMA vez e guarde:
      #   node -e "console.log(require('web-push').generateVAPIDKeys())"
      #
      # Trocar a chave pública depois invalida TODAS as inscrições já feitas
      # — cada aparelho se inscreveu com a chave de então, e o serviço de
      # push recusa um aviso assinado por outra. Quem já tinha ligado o aviso
      # pararia de receber, em silêncio, e só voltaria desligando e ligando
      # de novo.
      #
      # Sem as duas, o recurso não existe: a rota responde `ligado: false` e
      # a tela não mostra o interruptor, em vez de oferecer um caminho que
      # termina em falha.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Este não é segredo e fica versionado. O domínio precisa estar
      # verificado no Resend, e o endereço não precisa de caixa postal: o
      # Resend só envia, e quem responder cai em contato@saldonline.com.br
      # se houver Reply-To — por ora, ninguém responde a um "não responda".
      - key: MAIL_FROM
        value: "saldonline <nao-responda@saldonline.com.br>"
